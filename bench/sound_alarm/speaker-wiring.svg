<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="980" height="720" fill="#ffffff"/>
  <text x="490" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">sound_alarm wiring: Arduino Nano + HC-SR04 + speaker</text>
  <text x="490" y="60" text-anchor="middle" fill="#555">Wire with the USB unplugged. Pick option A or option B for the speaker, not both.</text>

  <!-- Nano -->
  <rect x="380" y="110" width="200" height="300" rx="8" fill="#1f5fa8"/>
  <rect x="455" y="90" width="50" height="30" rx="4" fill="#bbb"/>
  <text x="480" y="110" text-anchor="middle" font-size="11">USB</text>
  <text x="480" y="270" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">Arduino</text>
  <text x="480" y="294" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">Nano</text>
  <g fill="#fff" font-size="14" font-weight="bold">
    <text x="392" y="160">5V</text>
    <text x="392" y="200">GND</text>
    <text x="568" y="160" text-anchor="end">D3</text>
    <text x="568" y="200" text-anchor="end">D9</text>
    <text x="568" y="240" text-anchor="end">D10</text>
  </g>
  <g fill="#f4c542"><circle cx="380" cy="155" r="6"/><circle cx="380" cy="195" r="6"/><circle cx="580" cy="155" r="6"/><circle cx="580" cy="195" r="6"/><circle cx="580" cy="235" r="6"/></g>

  <!-- power rails -->
  <line x1="60" y1="460" x2="920" y2="460" stroke="#d62828" stroke-width="5"/>
  <text x="60" y="450" fill="#d62828" font-weight="bold">+ rail (5V)</text>
  <line x1="60" y1="490" x2="920" y2="490" stroke="#1d3557" stroke-width="5"/>
  <text x="60" y="515" fill="#1d3557" font-weight="bold">− rail (GND)</text>
  <polyline points="380,155 330,155 330,460" fill="none" stroke="#d62828" stroke-width="3"/>
  <polyline points="380,195 300,195 300,490" fill="none" stroke="#111" stroke-width="3"/>

  <!-- HC-SR04 -->
  <rect x="680" y="110" width="240" height="150" rx="8" fill="#2a9d8f"/>
  <circle cx="740" cy="160" r="32" fill="#ccc" stroke="#555" stroke-width="3"/>
  <circle cx="860" cy="160" r="32" fill="#ccc" stroke="#555" stroke-width="3"/>
  <text x="800" y="135" text-anchor="middle" fill="#fff" font-weight="bold">HC-SR04</text>
  <g fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="710" y="245">VCC</text><text x="770" y="245">Trig</text><text x="830" y="245">Echo</text><text x="890" y="245">GND</text>
  </g>
  <g fill="#f4c542"><circle cx="710" cy="260" r="6"/><circle cx="770" cy="260" r="6"/><circle cx="830" cy="260" r="6"/><circle cx="890" cy="260" r="6"/></g>
  <polyline points="710,260 710,460" fill="none" stroke="#d62828" stroke-width="3"/>
  <polyline points="890,260 890,490" fill="none" stroke="#111" stroke-width="3"/>
  <polyline points="580,195 640,195 640,300 770,300 770,260" fill="none" stroke="#e07a00" stroke-width="3"/>
  <polyline points="580,235 620,235 620,320 830,320 830,260" fill="none" stroke="#7b2cbf" stroke-width="3"/>

  <!-- D3 wire to both options -->
  <polyline points="580,155 610,155 610,90 40,90 40,560" fill="none" stroke="#2b9348" stroke-width="3" stroke-dasharray="0"/>
  <text x="50" y="84" font-size="13" fill="#2b9348" font-weight="bold">D3 = sound out</text>

  <!-- Option A -->
  <rect x="20" y="540" width="440" height="165" rx="10" fill="#f6f6f6" stroke="#bbb"/>
  <text x="56" y="565" font-weight="bold" font-size="17">A. Simplest: one resistor (quiet)</text>
  <line x1="40" y1="600" x2="110" y2="600" stroke="#2b9348" stroke-width="3"/>
  <rect x="110" y="588" width="70" height="24" rx="4" fill="#e9d8a6" stroke="#555"/>
  <text x="145" y="605" text-anchor="middle" font-size="12">220 Ω</text>
  <line x1="180" y1="600" x2="250" y2="600" stroke="#2b9348" stroke-width="3"/>
  <polygon points="250,585 270,585 295,565 295,635 270,615 250,615" fill="#444"/>
  <text x="262" y="605" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">+</text>
  <text x="310" y="604">speaker</text>
  <line x1="270" y1="615" x2="270" y2="660" stroke="#111" stroke-width="3"/>
  <text x="280" y="655" font-size="13">− → GND rail</text>
  <text x="56" y="690" font-size="13" fill="#444">D3 → 220 Ω → speaker +.  Speaker − → GND.  Keeps the pin safe.</text>

  <!-- Option B -->
  <rect x="480" y="540" width="480" height="165" rx="10" fill="#f6f6f6" stroke="#bbb"/>
  <text x="496" y="565" font-weight="bold" font-size="17">B. Louder: NPN transistor (2N2222 / PN2222)</text>
  <text x="496" y="592" font-size="13">D3 → 1 kΩ → transistor <tspan font-weight="bold">B</tspan> (middle leg)</text>
  <text x="496" y="614" font-size="13">transistor <tspan font-weight="bold">E</tspan> → GND rail</text>
  <text x="496" y="636" font-size="13">transistor <tspan font-weight="bold">C</tspan> → speaker −</text>
  <text x="496" y="658" font-size="13">speaker + → 10–22 Ω → 5V rail (limits the current)</text>
  <text x="496" y="684" font-size="12" fill="#444">Flat face toward you, legs down: E  B  C left to right (check your part's sheet).</text>
  <line x1="40" y1="560" x2="40" y2="600" stroke="#2b9348" stroke-width="3"/>
</svg>
